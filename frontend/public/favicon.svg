  />

  <!-- Crossbar & Nodes -->
  <path d="M 42 63 L 68 63" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" />
  <line x1="53" y1="43" x2="62" y2="63" stroke="#80f3ff" stroke-width="3" />

  <!-- Nodes -->
  <circle cx="62" cy="16" r="4.5" fill="#ffffff" />
  <circle cx="43" cy="63" r="3.5" fill="#00e5ff" />
  <circle cx="68" cy="63" r="3.5" fill="#00e5ff" />
  <circle cx="53" cy="43" r="3" fill="#ffffff" />
</svg>