  />

  <!-- Stylized Tech 'A' -->
  <path 
    d="M 62 16 L 88 78 C 89 80 87 83 84 83 L 72 83 C 70 83 68 82 67 80 L 61 65 L 43 65 L 53 43 L 62 16 Z" 
    fill="url(#logoAGrad)" 
  />
  
  <path 
    d="M 62 16 L 38 78 C 37 80 39 83 42 83 L 53 83 L 62 60 L 53 43 Z" 
